<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SciHub Access</title>
<style>
  body {
    width: 300px;
    font-family: Arial, sans serif;
    padding: 16px;
    background: #ffffff;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 12px 0;
    color: #B8342A;
    font-weight: bold;
    border-bottom: 2px solid #B8342A;
    padding-bottom: 8px;
  }
  input {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    border: 1px solid #B8342A;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 10px;
    color: #333;
  }
  input:focus {
    outline: none;
    box-shadow: 0 0 0 2px rgba(184,52,42,0.3);
  }
  button {
    width: 100%;
    padding: 10px;
    background: #B8342A;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover {
    background: #942a22;
  }
  #statut {
    font-size: 12px;
    color: #B8342A;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <h1>SciHub Access</h1>
  <input id="entree" type="text" placeholder="Paste a DOI, title, or URL">
  <button id="rechercher">Search on Sci Hub</button>
  <div id="statut"></div>
  <script src="popup.js"></script>
</body>
</html>
